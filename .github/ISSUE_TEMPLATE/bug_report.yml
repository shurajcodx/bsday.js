name: 🐛 Bug Report
description: Report a reproducible bug or incorrect date/Panchang calculation in bsday.js
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with **bsday.js**!
  - type: input
    id: package
    attributes:
      label: Package Name
      description: Which package is affected?
      placeholder: '@bsday.js/core or @bsday.js/dataset'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the package are you using?
      placeholder: '1.1.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code
      description: Provide a minimal code snippet to reproduce the behavior.
      render: typescript
      placeholder: |
        import { bsday } from '@bsday.js/core';

        const d = bsday.bs('2081/01/01');
        console.log(d.format('YYYY/MM/DD'));
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Node.js
        - Next.js (App Router)
        - Next.js (Pages Router)
        - Vite / React
        - Browser / Vanilla JS
        - Bun / Deno
    validations:
      required: false
